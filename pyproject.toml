[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "signalsage"
version = "1.0.0"
description = "Self-hosted IOC enrichment and personalized news digest bot"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "SignalSage contributors" }]
dynamic = ["dependencies"]

[project.scripts]
signalsage = "signalsage.main:run"

[tool.setuptools.dynamic]
# Single source of truth: requirements.txt (pinned), locked in requirements.lock.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["signalsage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["signalsage"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 55

[tool.ruff]
line-length = 100
# Style stays 3.12-compatible so ruff doesn't rewrite to 3.14-only syntax.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["signalsage"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
