platforms:
  slack:
    enabled: ${SLACK_ENABLED:-true}
    bot_token: ${SLACK_BOT_TOKEN}
    app_token: ${SLACK_APP_TOKEN}
    monitor_channels: []   # empty = all channels bot is in
    digest_channel: "${SLACK_DIGEST_CHANNEL:-ioc-check}"
    # Slack user IDs (e.g. "U01234ABCD") allowed to run !digest / !osint commands.
    # Empty = anyone in a monitored channel may run commands. IOC enrichment is
    # always automatic and is NOT gated by this allowlist.
    command_allowlist: []
  discord:
    enabled: ${DISCORD_ENABLED:-false}
    bot_token: ${DISCORD_BOT_TOKEN}
    monitor_channels: []   # empty = all channels bot can read
    digest_channel: "${DISCORD_DIGEST_CHANNEL:-}"   # channel ID (integer)
    # Discord user IDs (integer) allowed to run !digest / !osint commands.
    # Empty = anyone in a monitored channel may run commands.
    command_allowlist: []

auth:
  # Per-user cooldown in seconds applied to !digest / !osint commands across
  # both platforms. 0 disables the cooldown.
  command_cooldown_seconds: 30

intel:
  max_iocs_per_message: 5
  cache_ttl: 3600
  timeout: 10
  providers:
    virustotal:
      enabled: true
      api_key: ${VT_API_KEY}
    shodan:
      enabled: true
      api_key: ${SHODAN_API_KEY}
    greynoise:
      enabled: true
      api_key: ${GREYNOISE_API_KEY}
    abuseipdb:
      enabled: true
      api_key: ${ABUSEIPDB_API_KEY}
    otx:
      enabled: true
      api_key: ${OTX_API_KEY}
    urlhaus:
      enabled: true
      api_key: ${ABUSECH_API_KEY}
    threatfox:
      enabled: true
      api_key: ${ABUSECH_API_KEY}
    malwarebazaar:
      enabled: true
    ipinfo:
      enabled: true
      api_key: ${IPINFO_API_KEY}
    circl_cve:
      enabled: true
    urlscan:
      enabled: true
      # api_key: ${URLSCAN_API_KEY}   # optional — lifts rate limits
    crtsh:
      enabled: true
    whois_age:
      enabled: true
      # api_key: ${WHOISXML_API_KEY}  # optional — uses free RDAP without key
    circl_pdns:
      enabled: true
      api_key: ${CIRCL_PDNS_KEY}      # "user:password" — free account at circl.lu/services/passive-dns/
    hibp:
      enabled: true
      api_key: ${HIBP_API_KEY}        # required — https://haveibeenpwned.com/API/Key
    bgpview:
      enabled: true                   # free, no key required — https://bgpview.io/

digest:
  # Fallback schedule for topics that don't define their own (5-part cron).
  # 9am and 4pm fit the weekday and weekend active hours below.
  default_schedule: "0 9,16 * * *"
  timezone: "Australia/Brisbane"
  data_dir: "data"
  collection_minutes: 15           # collection continues through quiet hours
  bootstrap_days: 7                # initial install only; checkpoints survive restarts
  max_article_age_days: 8          # never post stories collected/published longer ago than this
  transcript_wait_days: 4          # hold an episode this long for its published transcript (source transcript_url)
  retention_days: 90
  article_chars: 6000              # body budget for ONE shortlisted article
  max_prompt_chars: 8000
  fetch_article_text: true
  enrich_cves: true                # reuse existing IOC providers for article CVEs
  top_stories_count: 5
  interest_topics: []              # legacy shorthand; profile.topics is preferred
  profile:
    minimum_score: 2.5
    topics: {}                    # e.g. {"ransomware": 3, "local LLM": 3}
    products: []                   # add products you actually use
    geography: []                  # e.g. ["Brisbane", "Queensland"]
    sources: {}                    # host -> bonus, e.g. {"abc.net.au": 0.5}
    exclude: ["sponsored"]

  # Watch-mode topics (watch_mode: true in the topic file) poll their sources on
  # an interval instead of a cron schedule and post immediately when a new item
  # matches relevance rules AND explicit alert_keywords. This is the default poll interval for watch-mode
  # topics that don't set their own `poll_interval_minutes`.
  watch_default_poll_minutes: 120

  # Quiet-hours gate applied to *scheduled* digest runs and watch-mode polls only
  # (an on-demand `!digest` command always bypasses it). A cron/interval trigger
  # that fires outside this window is skipped rather than deferred — it simply
  # doesn't post; collection continues and pending articles are retained. Times are HH:MM in `digest.timezone`. Remove this whole block
  # (or set `digest.active_hours: null`) to run around the clock again.
  active_hours:
    weekday_start: "06:00"   # Mon-Fri
    weekday_end: "18:00"
    weekend_start: "09:00"   # Sat-Sun
    weekend_end: "17:00"

  # LLM backend: "ollama" (local, free), "anthropic" (paid API), or "cli"
  # ("cli" shells out to the Claude Code / Codex CLI in headless mode — bills
  #  against your CLI subscription). Under docker-compose this is selected for
  #  you by COMPOSE_PROFILES (ollama|codex|claude); the codex/claude profiles
  #  bake the CLI into the bot image and mount your host credentials.
  llm_provider: "${LLM_PROVIDER:-ollama}"

  # Ollama — local LLM, no API cost. Runs on your own hardware.
  # Compare models with python -m signalsage.digest.evaluate before switching.
  # Use http://ollama:11434 when running via docker-compose --profile ollama
  # Use http://localhost:11434 when running Ollama separately
  ollama_base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
  ollama_model: "${OLLAMA_MODEL:-gemma2:2b}"
  ollama_num_ctx: 4096              # fixed budget; oversized prompts are rejected
  ollama_timeout: 600
  temperature: 0
  ollama_think: null               # set false for a thinking model that supports it

  # Anthropic Claude — paid API. Only used when llm_provider = "anthropic"
  anthropic_model: "claude-haiku-4-5-20251001"
  anthropic_api_key: "${ANTHROPIC_API_KEY}"

  # CLI backend — only used when llm_provider = "cli".
  # cli_command: "claude" (Claude Code) or "codex" (Codex CLI), or a full path.
  cli_command: "${CLI_COMMAND:-claude}"
  cli_extra_args: []        # extra flags, e.g. ["--model", "claude-opus-4-8"]
  cli_timeout: 600          # seconds to wait for the CLI to return

# ── Whisper podcast transcription (optional) ──────────────────────────────
# When enabled, podcast RSS enclosures (audio/*) are downloaded and transcribed
# before being passed to the LLM for summarisation.
# Requires the whisper service in docker-compose.yml.
whisper:
  enabled: ${WHISPER_ENABLED:-false}
  base_url: "http://whisper:8000"
  # max_audio_mb and transcription_timeout are enforced in fetcher.py constants
