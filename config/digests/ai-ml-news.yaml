# One digest topic per file. See template.yaml.example for the full field reference.
name: "AI & ML News"
tags: [ai, ml, llm]             # !digest ai
watch_mode: true                # polls continuously; manage keywords with `!digest keywords ai ...`
keywords: ["gpt", "claude", "gemini", "llm", "model release"]
exclude_keywords: []
digest_channel: "#general"
sources:
