# One digest topic per file. See template.yaml.example for the full field reference.
name: "General News"
tags: [news, aus, australia]    # !digest news
schedule: "0 9 * * *"            # one compact morning digest
top_stories_count: 3
keywords: ["australia", "breaking", "emergency"]
exclude_keywords: []
digest_channel: "#news"
sources:
  - name: "ABC News"
    url: "https://www.abc.net.au/news/feed/51120/rss.xml"
  - name: "Guardian Australia"
    url: "https://www.theguardian.com/australia-news/rss"
  - name: "SBS News"
    url: "https://www.sbs.com.au/news/feed"
  - name: "Reddit News"
    url: "https://www.reddit.com/r/news/.rss"
  - name: "Brisbane Times"
    url: "https://www.brisbanetimes.com.au/rss/feed.xml"
