# One digest topic per file. See template.yaml.example for the full field reference.
name: "Cybersecurity News"
tags: [cybernews, secnews]      # !digest cybernews
schedule: "0 9,16 * * *"         # compact morning and afternoon digests
top_stories_count: 5
keywords: ["zero-day", "breach", "apt", "cve", "exploit"]
exclude_keywords: []
digest_channel: "#general"
sources:
  - name: "The Hacker News"
    url: "https://feeds.feedburner.com/TheHackersNews"
  - name: "BleepingComputer"
    url: "https://www.bleepingcomputer.com/feed/"
  - name: "Dark Reading"
    url: "https://www.darkreading.com/rss.xml"
  - name: "The Record"
    url: "https://therecord.media/feed"
  - name: "Infosecurity Magazine"
    url: "https://www.infosecurity-magazine.com/rss/news/"
  - name: "CyberScoop"
    url: "https://www.cyberscoop.com/feed/"
  - name: "The Register Security"
    url: "https://www.theregister.com/security/headlines.atom"
  - name: "iTnews Security"  # Australian
    url: "https://www.itnews.com.au/RSS/rss.ashx?type=Category&ID=37"
