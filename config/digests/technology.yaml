    url: "https://www.techmeme.com/feed.xml"
  - name: "The Register"
    url: "https://www.theregister.com/headlines.atom"
  - name: "iTnews"  # Australian
    url: "https://www.itnews.com.au/RSS/rss.ashx"
  - name: "404 Media"
    url: "https://www.404media.co/rss/"
