# One digest topic per file. See template.yaml.example for the full field reference.
name: "Government Advisories"
tags: [advisories, gov, cisa]   # !digest advisories
schedule: "0 9 * * tue-sat"     # 9:00am Tue–Sat (Sat run needs to clear the 9am weekend start)
digest_channel: "#news"
top_stories_count: 4
sources:
  - name: "CISA Advisories"
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
  - name: "NCSC (UK)"
    url: "https://www.ncsc.gov.uk/api/1/services/v1/news-rss-feed.xml"
  - name: "NCSC (UK) Blog"
    url: "https://www.ncsc.gov.uk/api/1/services/v1/blog-post-rss-feed.xml"
  - name: "SANS Internet Storm Center"
    url: "https://isc.sans.edu/rssfeed_full.xml"
  # cyber.gov.au's own feeds (/rss/alerts, /rss/advisories) sit behind Akamai,
  # which blocks cloud-provider IPs, so a cloud-hosted bot can't fetch them.
  # ACSC/ASD alerts are covered through news coverage of them instead (joint
  # ASD advisories also appear in the CISA feed above).
  - name: "ACSC & ASD in the news"
    url: "https://news.google.com/rss/search?q=%22Australian%20Cyber%20Security%20Centre%22%20OR%20%22Australian%20Signals%20Directorate%22%20OR%20ACSC%20when%3A7d&hl=en-AU&gl=AU&ceid=AU%3Aen"
