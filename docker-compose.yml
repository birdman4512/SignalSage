# ─────────────────────────────────────────────────────────────────────────────
# Pick the digest LLM backend with a compose profile — exactly one of:
#
#   ollama  → local Ollama container (default, free, runs on your hardware)
#   codex   → bot image with the Codex CLI baked in (bills your Codex sub)
#   claude  → bot image with the Claude Code CLI baked in (bills your Claude sub)
#
# Set it once in .env:           COMPOSE_PROFILES=ollama
#   then:                        docker compose up -d --build
# …or pass it per command:       docker compose --profile codex up -d --build
#
# Only the selected bot variant starts (they all share container_name "signalsage",
# so Docker refuses to run two at once). ALWAYS `docker compose down` before
# switching profiles. The codex/claude profiles also require CLI_AUTH_DIR in .env.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Internal network — containers can reach each other by service name.
  # No host access; nothing binds to a host port unless explicitly mapped below.
  internal:
    driver: bridge
    internal: true   # blocks outbound internet from this network
    ipam:
      config:
        - subnet: 10.10.50.0/24

  # External network — used only by signalsage and ollama to reach the internet.
  external:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.51.0/24

# Shared base for every bot variant. Each profile-specific service below merges
# this in with <<: *bot and then layers on its build args / env / mounts.
x-bot-base: &bot-base
  build:
    context: .
  container_name: signalsage
  restart: unless-stopped
  env_file: .env
  networks:
    - internal   # talks to ollama / whisper
    - external   # reaches Slack, Discord, threat intel APIs (+ Anthropic/OpenAI for CLI)
  # Pinned public resolvers instead of inheriting the host's resolv.conf at
  # container-creation time — Docker never refreshes that snapshot, so if the
  # host's active resolver later changes (e.g. Tailscale MagicDNS toggled off),
  # a long-running container is left pointed at a dead upstream and every
  # outbound lookup (Discord gateway, RSS feeds, intel providers) starts
  # failing until it's recreated. Public resolvers don't move underneath us.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Bot + local Ollama LLM ──────────────────────────────────────────────
  signalsage-ollama:
    <<: *bot-base
    profiles: ["ollama"]
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

  # ── Bot with the Codex CLI baked in (digest.llm_provider: cli) ──────────
  signalsage-codex:
    <<: *bot-base
    profiles: ["codex"]
    build:
      context: .
      args:
        INSTALL_CLI_LLM: "true"
    # Run as root so the CLI can read/refresh the mounted host credentials
    # regardless of who owns them on the host.
    user: "0:0"
    environment:
      LLM_PROVIDER: cli
      CLI_COMMAND: codex
      CODEX_HOME: /root/.codex
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # Host dir that CONTAINS your .codex folder (set CLI_AUTH_DIR in .env).
      - ${CLI_AUTH_DIR:-./data}/.codex:/root/.codex

  # ── Bot with the Claude Code CLI baked in (digest.llm_provider: cli) ─────
  signalsage-claude:
    <<: *bot-base
    profiles: ["claude"]
    build:
      context: .
      args:
        INSTALL_CLI_LLM: "true"
    user: "0:0"
    environment:
      LLM_PROVIDER: cli
      CLI_COMMAND: claude
      CLAUDE_CONFIG_DIR: /root/.claude
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # Host dir that CONTAINS your .claude folder (set CLI_AUTH_DIR in .env).
      - ${CLI_AUTH_DIR:-./data}/.claude:/root/.claude

  # ── Local Ollama LLM (only with --profile ollama) ───────────────────────
  # Starts the server then auto-pulls OLLAMA_MODEL on first run.
  # On subsequent starts the model is already on the volume — pull is a no-op.
  # No host port binding — not accessible from outside Docker.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-start.sh:/ollama-start.sh:ro
    networks:
      - internal   # reachable by signalsage
      - external   # needed to download models from ollama.com
    entrypoint: ["/bin/bash", "/ollama-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/11434' 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    # Uncomment for GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Whisper speech-to-text (podcast transcription) ────────────────────
  # Used by digests regardless of LLM backend, so it has no profile and always
  # starts. OpenAI-compatible transcription API. Needs external access on first
  # start to download the model (~150 MB), cached on a volume afterwards.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    restart: unless-stopped
    environment:
      WHISPER__MODEL: base.en
    volumes:
      - whisper_data:/root/.cache/huggingface
    networks:
      - internal   # reachable by signalsage
      - external   # needed on first start to download the model
    # Capped so transcription can't starve Ollama/the bot on low-RAM hosts —
    # transcription just takes longer instead of pegging all CPUs.
    cpus: "1.0"
    mem_limit: 1g

volumes:
  ollama_data:
  whisper_data:
