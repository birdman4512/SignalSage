# SignalSage: one bot container. The digest model is Google Gemini (set
# GEMINI_API_KEY in .env); without a key the bot runs IOC enrichment only.
#
#   docker compose up -d --build     # start / update
#   docker compose logs -f

services:
  signalsage:
    build:
      context: .
    container_name: signalsage
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    # Explicit DNS servers instead of inheriting the host's resolv.conf at
    # container-creation time: Docker never refreshes that snapshot, so if the
    # host's resolver later changes, a long-running container is left pointed
    # at a dead upstream. Some networks drop outbound UDP/53 to public
    # resolvers; set DNS_SERVER_1/2 in .env to the reachable LAN resolver then.
    dns:
      - ${DNS_SERVER_1:-1.1.1.1}
      - ${DNS_SERVER_2:-8.8.8.8}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
